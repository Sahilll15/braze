[project]
name = "braze"
version = "0.1.0"
description = "A terminal coding agent with a hand-written loop."
requires-python = ">=3.11"
dependencies = ["openai", "python-dotenv"]

[project.scripts]
braze = "braze.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["braze*"]
